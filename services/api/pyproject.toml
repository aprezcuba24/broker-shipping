[project]
name = "broker-api"
version = "0.1.0"
description = "Broker B2B API (FastAPI scaffold)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.1",
    "email-validator>=2.0.0",
    "fastapi>=0.136.1",
    "greenlet>=3.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.10.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
